kind: Action
metadata:
  name: os-data
  knowledge-graph: bridge
spec:
  label: OS data
  query: |-
    MATCH (n:Person|Organization)
    WHERE n.sourceCode = 'OS'
    OPTIONAL MATCH (n)-[r]->(x)
    RETURN n, r, x
  returnType: GRAPH
  scope: GLOBAL
  inclusions: {}
  actionType: CYPHER
  canvasOptions:
    clearCanvas: false
    fitCanvas: false
  httpActionIncludeCanvasInPayload: false
