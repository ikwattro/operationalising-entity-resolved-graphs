      start: Organization
      end: EntityGroup
      offset: 0.0
    - label: RESOLVED_TO
      start: Person
      end: EntityGroup
      offset: 0.0
    entityGroupClassFqn: EntityGroup
    entityGroupRelationshipFqns:
    - Organization-RESOLVED_TO->EntityGroup
    - Person-RESOLVED_TO->EntityGroup
  settings:
  - name: accessControlEnabled
    value: false
  - name: actionMaxResultSize
    value: 3000
  - name: alertingDelayedMessageTemplate
    value: "There are new Event(s) for the Alert $alert_name. Since $notification_previous_time, there have been $eventsSize new Event(s). To see the Event(s), log on to Hume."
  - name: alertingDelayedSubjectTemplate
    value: New Event(s) for the Alert $alert_name
  - name: alertingMessageTemplate
    value: |-
      A new Event has been triggered for the Alert $alert_name at $event_time.
      To see the Event, log on to Hume.
  - name: alertingSharingEnabled
    value: false
  - name: alertingSubjectTemplate
    value: Alert $alert_name has a new Event
  - name: allowHtmlActionTabularResults
    value: false
  - name: copyCypherEnabled
    value: true
  - name: dataRefreshEnabled
    value: true
  - name: databaseTimezone
    value: UTC
  - name: editDeleteOnlyDataCreatedViaHume
    value: false
  - name: fixNodesPosition
    value: true
  - name: mdeEnabled
    value: false
  - name: operationSizeLimit
    value: 5000
  - name: query_feedback_enabled
    value: true
  - name: schemaStatisticsEnabled
    value: true
  - name: smart_entity_resolution_enabled
    value: true
  - name: totalSizeLimit
    value: 20000
  - name: typeAheadEnabled
    value: false
  - name: visualisationActionsInputParametersHistoryEnabled
    value: true
  - name: visualisationCleanWarning
    value: true
  - name: visualisationDateFormat
    value: DEFAULT
  - name: visualisationDoubleClick
    value: EXPAND_ALL
  - name: visualisationFineGrainedSearchEnabled
    value: true
  - name: visualisationGeospatialEnabled
    value: true
  - name: visualisationGroupingEnabled
    value: true
  - name: visualisationSearchHistoryEnabled
    value: true
  - name: visualisationTemporalEnabled
    value: true
  - name: visualisationTimezone
    value: UTC
  - name: visualisationUrlLinkOpenIconEnabled
    value: false
